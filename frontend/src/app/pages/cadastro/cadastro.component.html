<div class="cadastro-page">

    <div class="cadastro-card">

        <h1>Square Planner</h1>

        <h2>Criar conta</h2>

        <p class="subtitulo">
            Crie sua conta para acessar o planner
        </p>


        <div class="campo">

            <label>
                Nome
            </label>

            <input
                type="text"
                placeholder="Digite seu nome"
                [(ngModel)]="nome"
            >

        </div>


        <div class="campo">

            <label>
                Email
            </label>

            <input
                type="email"
                placeholder="Digite seu email"
                [(ngModel)]="email"
            >

        </div>


        <div class="campo">

            <label>
                Senha
            </label>

            <input
                type="password"
                placeholder="Digite sua senha"
                [(ngModel)]="senha"
            >

        </div>


        <div class="campo">

            <label>
                Confirmar senha
            </label>

            <input
                type="password"
                placeholder="Digite sua senha novamente"
                [(ngModel)]="confirmarSenha"
            >

        </div>


        @if (mensagemErro) {

            <p class="mensagem erro">
                {{ mensagemErro }}
            </p>

        }


        @if (mensagemSucesso) {

            <p class="mensagem sucesso">
                {{ mensagemSucesso }}
            </p>

        }


        <button
            class="botao-cadastrar"
            (click)="cadastrar()"
        >
            Criar conta
        </button>


        <button
            class="botao-voltar"
            (click)="voltarParaLogin()"
        >
            Já tenho uma conta
        </button>

    </div>

</div>
