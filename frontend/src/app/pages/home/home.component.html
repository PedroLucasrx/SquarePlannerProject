<div class="home">

    <header class="header">


        <h1>Square Planner</h1>

        @if (authService.logado()) {
            <p>
                Olá, {{ authService.usuario()?.nome }}!
            </p>
        }

    </header>


    @if (authService.logado()) {

        <main class="menu">

            <button
                class="btn btn-primary menu-item"
                routerLink="/provas"
            >
                Provas
            </button>

            <button
                class="btn btn-primary menu-item"
                routerLink="/ads"
            >
                ADs
            </button>

            <button
                class="btn btn-primary menu-item"
                routerLink="/tarefas"
            >
                Tarefas
            </button>

            <button
                class="btn btn-primary menu-item"
                routerLink="/eventos"
            >
                Eventos
            </button>

        </main>


        <button
            class="btn btn-danger btn-sair"
            (click)="sair()"
        >
            Sair
        </button>

    }


    @if (!authService.logado()) {

        <main class="login">

            <p>
                Você não está logado.
            </p>

            <button
                class="btn btn-primary"
                routerLink="/login"
            >
                Entrar
            </button>

        </main>

    }

</div>
<button
            class="btn btn-secondary btn-theme"
            type="button"
            (click)="themeService.toggleTheme()"
        >
            {{ themeService.theme() === 'dark' ? 'Tema claro' : 'Tema escuro' }}
        </button>
